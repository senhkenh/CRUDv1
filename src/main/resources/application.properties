spring.application.name=basic_CRUD_01

# URL de conexión (reemplaza localhost, puerto y nombre_bd)

spring.datasource.url=jdbc:postgresql://localhost:5432/nombre_tu_base_datos
spring.datasource.username=tu_usuario
spring.datasource.password=tu_contraseña
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Hibernate

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 'update' crea o actualiza las tablas automáticamente en desarrollo
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true


#JPA Settings

spring.jpa.datasbase-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate